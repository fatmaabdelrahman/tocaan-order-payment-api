services:
  # PHP-FPM application container (runs Laravel).
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tocaan_app
    working_dir: /var/www
    volumes:
      - ./:/var/www
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - tocaan

  # Nginx web server, proxies PHP requests to the app container.
  nginx:
    image: nginx:1.27-alpine
    container_name: tocaan_nginx
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - tocaan

  # MySQL 8 database.
  mysql:
    image: mysql:8.0
    container_name: tocaan_mysql
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: tocaan
      MYSQL_USER: tocaan
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - tocaan

networks:
  tocaan:
    driver: bridge

volumes:
  mysql_data:
    driver: local
